<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153a33"><title>义乌商贸库存管家</title><link rel="stylesheet" href="/static/app.css?v=0.4.1"><script defer src="/static/phase4.js?v=0.4.1.1"></script><script defer src="/static/phase3.js?v=0.4.1"></script><script defer src="/static/phase2.js?v=0.4.1"></script><script defer src="/static/app.js?v=0.4.1"></script></head>
<body>
<section id="login-view" class="login-view">
 <div class="login-story"><div class="brand-mark">仓</div><p class="eyebrow">YIWU INVENTORY</p><h1>每一件货，<br>都有一本明白账。</h1><p>从义乌档口到海外仓。<br>让收发有据，让库存可查。</p><div class="story-bottom">义乌商贸库存管家 <span>第四阶段 · 本地开发版</span></div></div>
 <div class="login-panel"><form id="login-form"><span class="small-label">欢迎回来</span><h2>登录库存工作台</h2><p class="muted">使用本地初始化时生成的岗位账号。</p><label>账号<input name="username" required autocomplete="username" placeholder="请输入账号"></label><label>密码<input name="password" required type="password" autocomplete="current-password" placeholder="请输入密码"></label><p id="login-error" class="error" role="alert"></p><button class="primary full" type="submit">进入工作台 <span>→</span></button><p class="login-help">初次使用？登录信息保存在项目目录<br><code>.local/login.txt</code></p></form></div>
</section>
<div id="app-view" class="app-shell hidden">
 <aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark">仓</span><span>义乌商贸<span class="brand-sub">库存管家</span></span></a><div class="nav-label">工作空间</div><nav aria-label="主导航"><button data-view="agent" class="nav-item"><span>✧</span>Agent 助手</button><button data-view="overview" class="nav-item active"><span>◫</span>工作台</button><button data-view="inventory" class="nav-item"><span>▦</span>库存总览</button><button data-view="receipt" class="nav-item"><span>↓</span>收货入库</button><button data-view="sale" class="nav-item"><span>↑</span>线下卖货</button><button data-view="purchases" class="nav-item"><span>▤</span>采购与收货</button><button data-view="approvals" class="nav-item"><span>✓</span>调整与冲正</button><button data-view="transfers" class="nav-item"><span>⇢</span>仓间调拨</button><button data-view="returns" class="nav-item"><span>↩</span>退货与质检</button><button data-view="ledger" class="nav-item"><span>≡</span>库存流水</button></nav><div class="nav-label secondary">基础管理</div><nav><button data-view="imports" class="nav-item"><span>⇣</span>批量导入</button><button data-view="catalog" class="nav-item"><span>◇</span>商品与仓库</button><button data-view="accounts" class="nav-item"><span>⚙</span>账号与试运行</button><button data-view="connections" class="nav-item"><span>⇄</span>渠道与连接</button></nav><div class="sidebar-bottom"><span class="status-dot"></span> 本地开发环境<p>演示数据 · 未连接外部平台</p></div></aside>
 <div class="workspace"><header class="topbar"><div><span class="workspace-name" id="tenant-name"></span><span class="environment">演示</span></div><div class="user-actions"><span id="user-name"></span><button id="logout" class="text-button">退出</button></div></header><main id="main" tabindex="-1"></main><footer>所有库存变化均保留来源与流水 <span>v0.4.1 · 第四阶段 1—5项</span></footer></div>
</div>
<dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" class="icon-button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields"></div><p id="editor-error" class="error" role="alert"></p><button class="primary full" type="submit">保存资料</button></form></dialog>
